<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №1</title>
</head>
<link rel="stylesheet" href="style3.css">

<body>


    <form action="https://formkeep.com/f/f47b0a42677e" accept-charset="UTF-8" method="POST">
        <h1> Реєстрація користувачів</h1>

        <div>
            <label for="name">Ім'я:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <label for="bithdate"> Дата народження</label>
        <input type="date" id="bithdate" name="bithdate">
        <div>
            <label for="last name">Прізвище:</label>
            <input type="text" id="last name" name="last name" required>
        </div>
        <label for="phone"> Номер телефону</label>
        <input type="tel" id="phone" name="phone" placeholder="+380123456789">
        <div>
            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="private">Пароль:</label>
            <input type="password" id="private" name="private" required>
        </div>
        <div>
            <label for="confirm private">Підтвердження пароля:</label>
            <input type="password" id="confirm private" name="confirm private" required>
        </div>
        <div>
            <input type="submit" value="Зареєструватися">
        </div>
    </form>
</body>

</html>
